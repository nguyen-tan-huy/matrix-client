[package]
name = "chosua-core"
version = "0.1.0"
edition = "2021"

# The UI-agnostic half of ChoSua: the Matrix worker and the Command/Event
# protocol it speaks. Shared by the Tauri app (Android, and desktop until
# the GTK one replaces it) and the native GTK desktop app. Never depends on
# a UI toolkit; per-platform hooks go through `platform`.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
# See tauri-app/src-tauri/Cargo.toml's history for why 0.18 exactly.
matrix-sdk = { version = "=0.18.0", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "sso-login",
] }
matrix-sdk-ui = { version = "=0.18.0", default-features = false }
matrix-sdk-crypto = { version = "=0.18.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
eyeball-im = "0.8"
tracing = "0.1"
mime = "0.3"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
directories = "5"
open = "5"
notify-rust = { version = "4.18", features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
