[package]
name = "matrix-tauri-client"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

tokio = { version = "1", features = ["full"] }

matrix-sdk = { version = "0.7", default-features = false, features = [
    "native-tls",
    "e2e-encryption",
    "sqlite",
    "sso-login",
] }
matrix-sdk-ui = { version = "0.7", default-features = false, features = [
    "native-tls",
    "e2e-encryption",
] }

reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
directories = "5"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime = "0.3"
base64 = "0.22"
arboard = { version = "3.6.1", features = ["image-data"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = { version = "0.3", features = ["tokio"] }
notify-rust = { version = "4.18", features = ["tokio"] }
