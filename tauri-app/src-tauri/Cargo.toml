[package]
name = "matrix-tauri-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "matrix_tauri_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
# Named directly so `lib.rs` can spell `url::Url` itself — the version
# tauri-plugin-deep-link's own `get_current()`/`on_open_url()` already use
# transitively, promoted to a direct dependency to name the type on the
# receiving end without re-deriving it from that plugin's API.
url = "2"

# Bumped straight to latest (0.18, from the original 0.7) — the homeserver
# in use here only speaks "Simplified Sliding Sync" (MSC4186), which 0.7
# doesn't understand at all (404s), and 0.8 (the first version that does
# support it) turned out to have its own bug: `RoomListService`'s built-in
# growing-room-list mechanism (`add_one_page()`) silently never grows,
# because its internal gate depends on the server ever reporting a
# `maximum_number_of_rooms`, which this server never did in testing. Later
# releases are the most likely place that got fixed, and going to latest
# also means TLS backend selection is no longer a feature toggle here at
# all — rustls is unconditionally baked into `matrix-sdk` as of this
# version (see its `Cargo.toml`), so neither crate below needs a
# `rustls-tls` feature listed anymore.
matrix-sdk = { version = "=0.18.0", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "sso-login",
] }
matrix-sdk-ui = { version = "=0.18.0", default-features = false }
# `matrix_sdk::crypto` (a re-export of this crate matrix-sdk-base provided)
# is gone in 0.18 — `AttachmentDecryptor` (used to decrypt downloaded
# media in an encrypted room) now needs this named directly.
matrix-sdk-crypto = { version = "=0.18.0", default-features = false }
# Named directly (matrix-sdk/reqwest already pull it in transitively) so
# `lib.rs`'s `run()` can call `install_default()` on it at startup — see
# the comment there for why that call is required at all.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
# Named to match the version matrix-sdk-ui/matrix-sdk already pull in
# transitively (see Cargo.lock) — promoted to a direct dependency so this
# crate can name `VectorDiff<T>` itself when converting `RoomListService`'s
# diff stream into IPC events (see `matrix/worker.rs`'s room-list code).
eyeball-im = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime = "0.3"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Desktop-only: single-instance guard, clipboard-image read (`arboard`),
# native OS notifications (`notify-rust`), and browser/file "open"
# (`open`) crate — none of these support Android/iOS. Mobile equivalents
# are pulled in below via Tauri's own plugins instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
directories = "5"
open = "5"
arboard = { version = "3.6.1", features = ["image-data"] }
notify-rust = { version = "4.18", features = ["tokio"] }

# Linux-only real tray (see src/tray.rs for why: Tauri's own tray-icon
# backend on Linux, libappindicator, has no left-click "Activate" event).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["tokio"] }
# System-theme colors (see src/gtk_theme.rs): Tauri's own window is a GTK
# window under the hood on Linux (WebKitGTK), so the running GTK theme's
# resolved colors are already sitting right there via `StyleContext` —
# same version gtk-rs's `wry`/`tauri-runtime-wry` already pulls in
# transitively, just promoted to a direct dependency so this crate can
# call into it too.
gtk = "0.18"
gdk = "0.18"

# Mobile-only: official cross-platform replacements for the desktop-only
# crates above.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# OAuth/SSO redirect catcher — see `matrix/oidc_callback.rs`. Desktop
# spins up a loopback HTTP server and waits for the browser to redirect
# to it, which only works as long as the app's process stays alive the
# whole time the user is in the browser. Mobile OSes can and do kill a
# backgrounded app process at any point (confirmed on Android/MIUI — the
# desktop mechanism just silently never completes when that happens), so
# mobile instead registers a custom URL scheme the browser redirects to,
# which Android/iOS deliver via an Intent/Activity launch that resumes
# (or cold-starts) the app either way.
tauri-plugin-deep-link = "2"
# Neither the Android NDK nor iOS ships a linkable libsqlite3 the way
# desktop OSes do — matrix-sdk-sqlite's `rusqlite` needs to compile its
# own copy from source there instead of dynamically linking one. Pinning
# the same version matrix-sdk-sqlite (0.18.0) pulls in makes Cargo unify
# the two into one build with this feature turned on, rather than two
# separate `rusqlite` copies.
rusqlite = { version = "0.37", features = ["bundled"] }

# Windows cross-compile (mingw) host has no system libsqlite3 to link
# against either — same fix as the mobile block above, bundle it.
[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
