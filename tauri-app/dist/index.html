<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Matrix</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>matrix login</h2>
    <label>homeserver</label>
    <input id="login-homeserver" value="https://matrix.org" />
    <label>username</label>
    <input id="login-username" />
    <label>password</label>
    <input id="login-password" type="password" />
    <div id="login-error" class="login-error" style="display:none;"></div>
    <button id="login-submit">sign in</button>
    <div class="login-sep">— or —</div>
    <button id="login-oauth">continue with sso / oauth</button>
  </div>
</div>

<div id="chat-screen">
  <div id="room-list">
    <div id="room-list-header">
      <span>CHATS</span>
      <div id="room-list-header-actions">
        <button id="btn-create-room" class="small-btn" title="create room or space">[+]</button>
        <button id="btn-reload-rooms" class="small-btn" title="reload room list and unread counts">[ reload ]</button>
        <button id="btn-global-threads" class="small-btn" title="threads with new replies, across all rooms">[ threads ]</button>
        <div id="chats-menu-wrap">
          <button id="btn-chats-menu" class="small-btn" title="more">[ ⋯ ]</button>
          <div id="chats-menu" style="display:none;">
            <button id="btn-profile" class="small-btn" title="your profile — avatar, display name">[ profile ]</button>
            <button id="btn-security" class="small-btn" title="security">[ security ]</button>
            <button id="btn-user-search" class="small-btn" title="find every message from one user, across all rooms">[ user msgs ]</button>
            <button id="btn-message-search" class="small-btn" title="search message text, across all rooms">[ search ]</button>
            <button id="btn-theme" class="small-btn" title="theme: follows system">[ theme: system ]</button>
            <button id="btn-font-settings" class="small-btn" title="font family & size for the whole app">[ font ]</button>
            <button id="btn-shortcuts" class="small-btn" title="keyboard shortcuts (?)">[ shortcuts ]</button>
            <button id="btn-logout" class="small-btn" title="sign out of this session">[ logout ]</button>
          </div>
        </div>
      </div>
    </div>
    <div id="space-picker"></div>
    <div id="room-filter-row">
      <input id="room-filter" placeholder="search rooms..." />
      <button id="btn-unread-only" class="small-btn" title="show only rooms with unread messages">[ unread ]</button>
      <button id="btn-mentions-only" class="small-btn" title="show only rooms with an unread mention of you">[ @mentions ]</button>
    </div>
    <div id="room-list-items"></div>
  </div>
  <div id="resizer-left" class="resizer"></div>
  <div id="main-panel">
    <div id="timeline-header">
      <button id="btn-back-to-rooms" class="small-btn" title="back to room list">[ ‹ ]</button>
      <span id="timeline-title">select a conversation</span>
      <div id="timeline-header-actions" style="display:none;">
        <button id="btn-mark-read" class="small-btn" title="mark this room as read">[ mark read ]</button>
        <button id="btn-room-threads" class="small-btn">[ threads ]</button>
        <div id="room-menu-wrap">
          <button id="btn-room-menu" class="small-btn">[ ⋯ ]</button>
          <div id="room-menu" style="display:none;">
            <button id="btn-favorite-room" class="small-btn">[ ☆ favorite ]</button>
            <button id="btn-invite" class="small-btn">[ invite ]</button>
            <button id="btn-leave-room" class="small-btn">[ leave ]</button>
            <select id="notification-mode">
              <option value="all">🔔 all</option>
              <option value="mentions">🔔 mentions</option>
              <option value="mute">🔇 mute</option>
            </select>
            <button id="btn-room-settings" class="small-btn">[ room settings ]</button>
            <button id="btn-pins" class="small-btn">[ pins ]</button>
            <button id="btn-polls" class="small-btn">[ polls ]</button>
            <button id="btn-summarize" class="small-btn">[ summarize ]</button>
          </div>
        </div>
      </div>
    </div>
    <div id="pinned-banner" style="display:none;"></div>
    <div id="timeline-wrap">
      <div id="timeline" tabindex="-1">
        <div id="timeline-placeholder">select a conversation</div>
      </div>
      <button id="btn-jump-latest" class="jump-latest-btn" style="display:none;" title="jump to latest message">↓</button>
      <div id="typing-indicator" style="display:none;"></div>
    </div>
    <div id="reply-indicator" style="display:none;"></div>
    <div id="edit-indicator" style="display:none;"></div>
    <div id="mention-suggestions" style="display:none;"></div>
    <div id="pending-image-preview" style="display:none;"></div>
    <div id="pending-file-preview" style="display:none;"></div>
    <div id="compose-toolbar" class="compose-toolbar" style="display:none;">
      <button type="button" class="md-btn" data-md="bold" title="bold (Ctrl+B)"><b>B</b></button>
      <button type="button" class="md-btn" data-md="italic" title="italic (Ctrl+I)"><i>I</i></button>
      <button type="button" class="md-btn" data-md="code" title="inline code (Ctrl+E)">code</button>
      <button type="button" class="md-btn" data-md="codeblock" title="code block (Ctrl+Shift+E)">{ }</button>
      <button type="button" class="md-btn" data-md="link" title="link">link</button>
      <button type="button" class="md-btn emoji-btn" title="emoji">🙂</button>
    </div>
    <div id="compose-row" style="display:none;">
      <div id="meme-picker-wrap">
        <button id="btn-compose-plus" class="small-btn" title="attach image / file / emoji / voice message / poll">+</button>
        <div id="meme-picker" style="display:none;"></div>
      </div>
      <div class="compose-editor-wrap">
        <textarea id="compose-input" class="compose-textarea" rows="1" placeholder="message... (@ to mention, **bold**, *italic*, `code` — shift+enter for a new line)"></textarea>
      </div>
      <button id="compose-send">send</button>
      <input type="file" id="file-input" accept="image/*" style="display:none;" />
      <input type="file" id="generic-file-input" style="display:none;" />
      <input type="file" id="import-keys-file-input" accept=".txt" style="display:none;" />
      <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" />
    </div>
  </div>
  <div id="resizer-right" class="resizer" style="display:none;"></div>
  <div id="side-panel" style="display:none;"></div>
</div>

<!-- Vendored (not CDN-loaded — this app runs offline besides its actual
     Matrix API calls) markdown rendering: `marked` parses to HTML, then
     `DOMPurify` sanitizes it before it ever reaches an `innerHTML` — see
     `renderMarkdown()` in app.js for why that second step is load-bearing,
     not optional (marked itself passes raw HTML in the source straight
     through, and message bodies come from other, untrusted room members). -->
<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
