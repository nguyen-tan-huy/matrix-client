[package]
name = "matrix-egui-client"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "all_loaders"] }
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp", "bmp"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

matrix-sdk = { version = "0.7", default-features = false, features = [
    "native-tls",
    "e2e-encryption",
    "sqlite",
    "sso-login",
] }
matrix-sdk-ui = { version = "0.7", default-features = false, features = [
    "native-tls",
    "e2e-encryption",
] }

reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
directories = "5"
open = "5"
notify-rust = "4"
ksni = { version = "0.3", features = ["tokio"] }
fs4 = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.15"
arboard = "3"
mime = "0.3"
egui_commonmark = "0.18"
