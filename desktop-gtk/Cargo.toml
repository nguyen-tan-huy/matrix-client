[package]
name = "chosua-gtk"
version = "0.1.0"
edition = "2021"

# Native desktop front end (GTK4 + libadwaita) over chosua-core. Android
# keeps the Tauri app; this replaces it on the Linux desktop, where the
# WebKitGTK webview redrew the whole (glass) window on every hover.

[[bin]]
name = "chosua-gtk"
path = "src/main.rs"

[dependencies]
chosua-core = { path = "../core" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
tokio = { version = "1", features = ["full"] }
pulldown-cmark = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# See tauri-app's lib.rs `run()`: two rustls backends are reachable, so one
# has to be installed explicitly before the first TLS connection.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
ksni = { version = "0.3", features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
opus = "0.4"
ogg = "0.9"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
